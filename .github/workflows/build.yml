name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jellyfin: ${{ steps.list.outputs.jellyfin }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        # Inside the echo the exit status would be the echo's, and an empty matrix passes.
        run: |
          releases=$(python3 test/versions.py --json)
          echo "jellyfin=$releases" >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ${{ fromJSON(needs.versions.outputs.jellyfin) }}
    steps:
      - uses: actions/checkout@v7

      # Builds in the same SDK container the script uses locally, so a green run
      # here means the same thing it means on a developer's machine.
      - run: JELLYFIN_IMAGE=jellyfin/jellyfin:${{ matrix.jellyfin }} sh test/run.sh
