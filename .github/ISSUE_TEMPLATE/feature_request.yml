name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: A new column, a different view, anything the table cannot do today.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it now?
