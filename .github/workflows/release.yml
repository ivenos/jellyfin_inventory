name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [released]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-build-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" \
            | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo "tag $GITHUB_REF_NAME does not name a three part version of digits" >&2
            exit 1
          }
          echo "VERSION=$version.0" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet build -c Release --nologo \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Package
        run: |
          python3 .github/scripts/make-meta.py --version "$VERSION" --out meta.json
          dll=Jellyfin.Plugin.Inventory/bin/Release/net10.0/Jellyfin.Plugin.Inventory.dll
          # zip only fails where nothing at all matched, not where one name did not.
          [ -f "$dll" ] || { echo "the build left no assembly at $dll" >&2; exit 1; }
          zip -j "inventory_$VERSION.zip" meta.json "$dll" .github/assets/thumb.png

      # A release created in the web interface is published as it tags and stays published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="inventory_$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Outside the condition, so a failed query still stops the step.
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
            [ "$draft" = "true" ] || [ "$draft" = "false" ] || {
              echo "could not read whether $GITHUB_REF_NAME is still a draft" >&2
              exit 1
            }
            if [ "$draft" = "false" ] && printf '%s\n' "$assets" | grep -qFx "$asset"; then
              echo "$GITHUB_REF_NAME is published and already carries $asset" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --draft --title "$GITHUB_REF_NAME"
          fi

  manifest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: release-manifest-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Add the release to manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${TAG#v}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo "tag $TAG does not name a three part version of digits" >&2
            exit 1
          }
          version="${TAG#v}.0"
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/inventory_$version.zip"
          # The tag push may still be building the archive, started by the same click.
          for attempt in $(seq 1 70); do
            curl -fsSL --max-time 60 "$url" -o package.zip && break
            [ "$attempt" = 70 ] && { echo "no archive at $url" >&2; exit 1; }
            sleep 30
          done
          # From the tag, not main: main may already carry the abi of the next Jellyfin.
          abi=$(git show "$TAG:build.yaml" | sed -n 's|^targetAbi:[[:space:]]*"\(.*\)"|\1|p')
          checksum=$(md5sum package.zip | cut -d' ' -f1)
          rm package.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 .github/scripts/update-manifest.py \
              --version "$version" \
              --target-abi "$abi" \
              --source-url "$url" \
              --checksum "$checksum" \
              --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --changelog="$NOTES"
            git add manifest.json
            git diff --staged --quiet && exit 0
            git commit --quiet -m "chore: add $TAG to the plugin manifest"
            git push && exit 0
            sleep $((attempt * 10))
          done
          echo "manifest.json could not be pushed after three tries" >&2
          exit 1
