name: Bug Report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you can. Only the first field is required.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, and what the table showed instead.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "e.g. Jellyfin 12.0.1, Inventory 0.1.0"

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Firefox 145, Safari 18"

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: >-
        A screenshot of the table often says it all. For a server-side problem,
        the lines mentioning Inventory from Dashboard > Logs help; adding
        `"Jellyfin.Plugin.Inventory": "Debug"` to the `Override` block of a
        `logging.json` in your config directory makes them more detailed.
