name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The new version, such as 1.5.0
        required: true
        type: string
  push:
    tags: ["v*"]
  release:
    types: [released]

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-build-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        run: |
          version="${VERSION#v}"
          printf '%s\n' "$version" \
            | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo "$VERSION does not name a three part version of digits" >&2
            exit 1
          }
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$version.0" >> "$GITHUB_ENV"

      - name: Stamp the changelog and tag the commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release is started from main"
            exit 1
          fi
          sh .github/scripts/changelog.sh release "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $VERSION" CHANGELOG.md
          git tag -a "v$VERSION" -m "v$VERSION"

      - name: Build
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet build -c Release --nologo \
            -p:Version="$PLUGIN_VERSION" -p:AssemblyVersion="$PLUGIN_VERSION" -p:FileVersion="$PLUGIN_VERSION"

      - name: Package
        run: |
          python3 .github/scripts/make-meta.py --version "$PLUGIN_VERSION" --out meta.json
          dll=Jellyfin.Plugin.Inventory/bin/Release/net10.0/Jellyfin.Plugin.Inventory.dll
          # zip only fails where nothing at all matched, not where one name did not.
          [ -f "$dll" ] || { echo "the build left no assembly at $dll" >&2; exit 1; }
          zip -j "inventory_$PLUGIN_VERSION.zip" meta.json "$dll" .github/assets/thumb.png

      - name: Push the commit and the tag
        if: github.event_name == 'workflow_dispatch'
        run: git push --atomic origin HEAD:main "v$VERSION"

      # A release created in the web interface is published as it tags, stays published and keeps its notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="inventory_$PLUGIN_VERSION.zip"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Outside the condition, so a failed query still stops the step.
            draft=$(gh release view "$TAG" --json isDraft -q .isDraft)
            assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
            [ "$draft" = "true" ] || [ "$draft" = "false" ] || {
              echo "could not read whether $TAG is still a draft" >&2
              exit 1
            }
            if [ "$draft" = "false" ] && printf '%s\n' "$assets" | grep -qFx "$asset"; then
              echo "$TAG is published and already carries $asset" >&2
              exit 1
            fi
            if [ "$draft" = "true" ]; then
              sh .github/scripts/changelog.sh notes "${TAG#v}" > "$notes"
              gh release edit "$TAG" --notes-file "$notes"
            fi
            gh release upload "$TAG" "$asset" --clobber
          else
            sh .github/scripts/changelog.sh notes "${TAG#v}" > "$notes"
            gh release create "$TAG" "$asset" --draft --title "$TAG" --notes-file "$notes"
          fi

  manifest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: release-manifest-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Add the release to manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${TAG#v}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo "tag $TAG does not name a three part version of digits" >&2
            exit 1
          }
          version="${TAG#v}.0"
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/inventory_$version.zip"
          # The tag push may still be building the archive, started by the same click.
          for attempt in $(seq 1 70); do
            curl -fsSL --max-time 60 "$url" -o package.zip && break
            [ "$attempt" = 70 ] && { echo "no archive at $url" >&2; exit 1; }
            sleep 30
          done
          # From the tag, not main: main may already carry the abi of the next Jellyfin.
          abi=$(git show "$TAG:build.yaml" | sed -n 's|^targetAbi:[[:space:]]*"\(.*\)"|\1|p')
          checksum=$(md5sum package.zip | cut -d' ' -f1)
          rm package.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 .github/scripts/update-manifest.py \
              --version "$version" \
              --target-abi "$abi" \
              --source-url "$url" \
              --checksum "$checksum" \
              --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --changelog="$NOTES"
            git add manifest.json
            git diff --staged --quiet && exit 0
            git commit --quiet -m "chore: add $TAG to the plugin manifest"
            git push && exit 0
            sleep $((attempt * 10))
          done
          echo "manifest.json could not be pushed after three tries" >&2
          exit 1
